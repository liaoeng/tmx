# 面向 Linux 主机部署；密码由同目录 .env 或当前进程环境提供。
x-app-environment: &app-environment
  TZ: Asia/Shanghai
  SPRING_PROFILES_ACTIVE: prod
  TMX_DB_HOST: 127.0.0.1
  TMX_DB_PORT: 3306
  TMX_DB_USERNAME: ${TMX_DB_USERNAME:-tmx_dev}
  TMX_DB_PASSWORD: ${TMX_DB_PASSWORD:?请设置 TMX_DB_PASSWORD}
  TMX_REDIS_HOST: 127.0.0.1
  TMX_REDIS_PORT: 6379
  TMX_REDIS_PASSWORD: ${TMX_REDIS_PASSWORD:?请设置 TMX_REDIS_PASSWORD}

services:
  mysql:
    image: mysql:8.4.9
    container_name: mysql
    environment:
      # 时区上海
      TZ: Asia/Shanghai
      # root 密码
      MYSQL_ROOT_PASSWORD: ${TMX_MYSQL_ROOT_PASSWORD:?请设置 TMX_MYSQL_ROOT_PASSWORD}
      # 初始化数据库(后续的初始化sql会在这个库执行)
      MYSQL_DATABASE: tmx
      # 官方镜像仅在空数据目录首次初始化时创建应用账号。
      MYSQL_USER: ${TMX_DB_USERNAME:-tmx_dev}
      MYSQL_PASSWORD: ${TMX_DB_PASSWORD:?请设置 TMX_DB_PASSWORD}
    volumes:
      # 数据挂载
      - /docker/mysql/data/:/var/lib/mysql/
      # 配置挂载
      - /docker/mysql/conf/:/etc/mysql/conf.d/
      # 仅首次初始化执行；已有数据目录不会重新导入。
      - ../sql/tmx.sql:/docker-entrypoint-initdb.d/10-tmx.sql:ro
      - ../sql/tmx_workflow.sql:/docker-entrypoint-initdb.d/20-workflow.sql:ro
    command:
      --bind-address=127.0.0.1
      --mysqlx-bind-address=127.0.0.1
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --explicit_defaults_for_timestamp=true
      --lower_case_table_names=1
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=tcp -h127.0.0.1 -u"$$MYSQL_USER" tmx -e "SELECT 1 FROM sys_user LIMIT 1" >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    network_mode: "host"

  nginx-web:
    image: nginx:1.31.1
    container_name: nginx-web
    environment:
      # 时区上海
      TZ: Asia/Shanghai
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 证书映射
      - /docker/nginx/cert:/etc/nginx/cert
      # 配置文件映射
      - /docker/nginx/conf/nginx.conf:/etc/nginx/nginx.conf
      # 页面目录
      - /docker/nginx/html:/usr/share/nginx/html
      # 日志目录
      - /docker/nginx/log:/var/log/nginx
    privileged: true
    network_mode: "host"

  redis:
    image: redis:8.6.3
    container_name: redis
    environment:
      # 时区上海
      TZ: Asia/Shanghai
      TMX_REDIS_PASSWORD: ${TMX_REDIS_PASSWORD:?请设置 TMX_REDIS_PASSWORD}
    volumes:
      # 配置文件
      - ./redis/conf/redis.conf:/redis/config/redis.conf:ro
      # 数据文件
      - /docker/redis/data/:/redis/data/:rw
    command: ["redis-server", "/redis/config/redis.conf", "--requirepass", "${TMX_REDIS_PASSWORD:?请设置 TMX_REDIS_PASSWORD}", "--bind", "127.0.0.1"]
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$TMX_REDIS_PASSWORD" redis-cli -h 127.0.0.1 ping | grep -qx PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    network_mode: "host"

  minio:
    # pgsty 开源社区 fork 重新维护的最新版 minio
    image: pgsty/minio:RELEASE.2026-04-17T00-00-00Z
    container_name: minio
    ports:
      # api 端口
      - "9000:9000"
      # 控制台端口
      - "9001:9001"
    environment:
      # 时区上海
      TZ: Asia/Shanghai
      # 管理后台用户名
      MINIO_ROOT_USER: tmx
      # 管理后台密码，最小8个字符
      MINIO_ROOT_PASSWORD: ${TMX_MINIO_PASSWORD:-tmx-local-storage}
      # https需要指定域名
      #MINIO_SERVER_URL: "https://xxx.com:9000"
      #MINIO_BROWSER_REDIRECT_URL: "https://xxx.com:9001"
      # 开启压缩 on 开启 off 关闭
      MINIO_COMPRESS: "off"
      # 扩展名 .pdf,.doc 为空 所有类型均压缩
      MINIO_COMPRESS_EXTENSIONS: ""
      # mime 类型 application/pdf 为空 所有类型均压缩
      MINIO_COMPRESS_MIME_TYPES: ""
    volumes:
      # 映射当前目录下的data目录至容器内/data目录
      - /docker/minio/data:/data
      # 映射配置目录
      - /docker/minio/config:/root/.minio/
    command: server --address ':9000' --console-address ':9001' /data  # 指定容器中的目录 /data
    privileged: true
    network_mode: "host"

  tmx-server1:
    image: tmx/tmx-server:6.0.0
    container_name: tmx-server1
    environment:
      <<: *app-environment
      SERVER_PORT: 8080
      SNAIL_JOB_PORT: 28080
      SNAIL_AI_PORT: 38080
    volumes:
      # 配置文件
      - /docker/server1/logs/:/tmx/server/logs/
      # skywalking 探针
#      - /docker/skywalking/agent/:/tmx/skywalking/agent
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    network_mode: "host"

  tmx-server2:
    image: tmx/tmx-server:6.0.0
    container_name: tmx-server2
    environment:
      <<: *app-environment
      SERVER_PORT: 8081
      SNAIL_JOB_PORT: 28081
      SNAIL_AI_PORT: 38081
    volumes:
      # 配置文件
      - /docker/server2/logs/:/tmx/server/logs/
      # skywalking 探针
#      - /docker/skywalking/agent/:/tmx/skywalking/agent
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    network_mode: "host"

  tmx-monitor-admin:
    image: tmx/tmx-monitor-admin:6.0.0
    container_name: tmx-monitor-admin
    environment:
      # 时区上海
      TZ: Asia/Shanghai
    volumes:
      # 配置文件
      - /docker/monitor/logs/:/tmx/monitor/logs
    privileged: true
    network_mode: "host"

  tmx-snailjob-server:
    image: tmx/tmx-snailjob-server:6.0.0
    container_name: tmx-snailjob-server
    environment:
      # 时区上海
      TZ: Asia/Shanghai
    ports:
      - "8800:8800"
      - "17888:17888"
    volumes:
      - /docker/snailjob/logs/:/tmx/snailjob/logs
    privileged: true
    network_mode: "host"

  tmx-snailai-server:
    image: tmx/tmx-snailai-server:6.0.0
    container_name: tmx-snailai-server
    environment:
      # 时区上海
      TZ: Asia/Shanghai
      # Docling 与 PaddleOCR 服务需单独部署；host 网络模式下默认通过宿主机端口访问
      SNAIL_AI_RAG_DOCLING_ENABLED: ${SNAIL_AI_RAG_DOCLING_ENABLED:-true}
      SNAIL_AI_RAG_DOCLING_URL: ${SNAIL_AI_RAG_DOCLING_URL:-http://127.0.0.1:5100}
      SNAIL_AI_RAG_DOCLING_PADDLE_OCR_ENABLED: ${SNAIL_AI_RAG_DOCLING_PADDLE_OCR_ENABLED:-true}
      SNAIL_AI_RAG_DOCLING_PADDLE_OCR_URL: ${SNAIL_AI_RAG_DOCLING_PADDLE_OCR_URL:-http://127.0.0.1:8866/ocr}
    ports:
      - "8900:8900"
      - "18888:18888"
    volumes:
      - /docker/snailai/logs/:/tmx/snailai/logs
    privileged: true
    network_mode: "host"
