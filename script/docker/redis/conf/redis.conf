# 密码由 Compose 的 TMX_REDIS_PASSWORD 通过启动参数传入。
# 单独启动时同样必须设置 --requirepass；默认仅监听本机。
bind 127.0.0.1
protected-mode yes

# key 监听器配置
# notify-keyspace-events Ex

# 使用官方镜像工作目录，确保首次挂载的数据目录可由 redis 用户写入。
dir /data
# 配置rdb
# 15分钟内有至少1个key被更改则进行快照
save 900 1
# 5分钟内有至少10个key被更改则进行快照
save 300 10
# 1分钟内有至少10000个key被更改则进行快照
save 60 10000
# 开启压缩
rdbcompression yes
# rdb文件名 用默认的即可
dbfilename dump.rdb

# 开启aof
appendonly yes
# 文件名
appendfilename "appendonly.aof"
# 持久化策略,no:不同步,everysec:每秒一次,always:总是同步,速度比较慢
# appendfsync always
appendfsync everysec
# appendfsync no
