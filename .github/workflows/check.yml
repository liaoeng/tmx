name: 后端与部署自动检查

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 仅供临时 CI 容器使用，与实际部署凭据无关。
      TMX_MYSQL_ROOT_PASSWORD: ci-root-password
      TMX_DB_USERNAME: tmx_dev
      TMX_DB_PASSWORD: ci-app-password
      TMX_REDIS_PASSWORD: ci-redis-password
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 编译、回归测试与打包
        run: bash mvnw -B -Pdev,gen -pl tmx-admin -am verify
      - name: 确认关键回归测试没有被跳过
        run: test -f tmx-admin/target/surefire-reports/TEST-org.tmx.test.PageContractTest.xml
      - name: 校验部署变量与容器配置
        run: |
          docker compose -f script/docker/docker-compose.yml config --quiet
          for required in TMX_MYSQL_ROOT_PASSWORD TMX_DB_PASSWORD TMX_REDIS_PASSWORD; do
            if env -u "$required" docker compose -f script/docker/docker-compose.yml config --quiet >/dev/null 2>&1; then
              echo "缺少 $required 时配置应拒绝启动"
              exit 1
            fi
          done
      - name: 验证空库初始化及应用账号连接
        run: |
          docker compose -f script/docker/docker-compose.yml up -d --wait --wait-timeout 180 mysql redis
          docker compose -f script/docker/docker-compose.yml exec -T mysql sh -c 'MYSQL_PWD="$MYSQL_PASSWORD" mysql --default-character-set=utf8mb4 --protocol=tcp -h127.0.0.1 -u"$MYSQL_USER" tmx -e "SELECT COUNT(*) FROM sys_user; SELECT COUNT(*) FROM flow_definition;"'
          # 用 ASCII 账号条件读取中文昵称，检查初始化连接是否正确解码 UTF-8。
          nickname=$(docker compose -f script/docker/docker-compose.yml exec -T mysql sh -c 'MYSQL_PWD="$MYSQL_PASSWORD" mysql --default-character-set=utf8mb4 --protocol=tcp -h127.0.0.1 -u"$MYSQL_USER" --batch --skip-column-names tmx -e "SELECT nick_name FROM sys_user WHERE user_name = 0x74657374;"')
          if [ "$nickname" != '本部门及以下 密码666666' ]; then
            echo '初始化中文昵称不符合预期，请检查 SQL 导入连接的字符集'
            exit 1
          fi
      - name: 验证 Redis 数据写入与持久化
        run: |
          docker compose -f script/docker/docker-compose.yml exec -T redis sh -ec '
            export REDISCLI_AUTH="$TMX_REDIS_PASSWORD"
            test "$(redis-cli SET tmx:ci:persistence ok EX 60)" = OK
            test "$(redis-cli SAVE)" = OK
            test -s /data/dump.rdb
            test "$(redis-cli DEL tmx:ci:persistence)" = 1
          '
      - name: 使用部署镜像验证生产配置启动
        run: |
          docker build -t tmx/tmx-server:6.0.0 tmx-admin
          docker compose -f script/docker/docker-compose.yml up -d tmx-server1
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/auth/code > /tmp/tmx-response.json && jq -e '.code == 200' /tmp/tmx-response.json >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo '主应用未在限定时间内返回正常验证码响应'
          exit 1
      - name: 失败时输出容器日志
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/tmx-deployment"
          # 诊断命令失败时也保存错误文本，并继续收集其他诊断。
          docker compose -f script/docker/docker-compose.yml ps --all 2>&1 | tee "$RUNNER_TEMP/tmx-deployment/containers.txt" || true
          docker compose -f script/docker/docker-compose.yml logs --no-color --tail 200 mysql redis tmx-server1 2>&1 | tee "$RUNNER_TEMP/tmx-deployment/container-logs.txt" || true
          docker compose -f script/docker/docker-compose.yml ps --all -q mysql redis tmx-server1 | xargs -r docker inspect --format '{{.Name}} {{json .State}}' 2>&1 | tee "$RUNNER_TEMP/tmx-deployment/health.txt" || true
      - name: 保存部署诊断日志
        uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: 部署诊断日志
          path: ${{ runner.temp }}/tmx-deployment/
          if-no-files-found: ignore
          retention-days: 7
      - name: 清理本次 CI 容器
        if: always()
        run: docker compose -f script/docker/docker-compose.yml down
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: 后端测试结果
          path: tmx-admin/target/surefire-reports/
